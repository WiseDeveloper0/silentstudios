# Pages CMS configuration — edit the website at https://app.pagescms.org
# Each entry below shows up as a page in the editor's sidebar.

media:
  input: assets
  output: /assets

content:
  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: contact_email
        label: Contact email
        type: string
        description: Shown in the Contact section and Support answers.
      - name: waitlist_endpoint
        label: Waitlist form link (Formspree)
        type: string
        description: Paste your Formspree form URL, e.g. https://formspree.io/f/abcdefg. Leave empty for demo mode.
      - name: contact_endpoint
        label: Contact form link (optional)
        type: string
        description: Optional. Leave empty and contact messages are emailed to the contact email above (via FormSubmit).
      - name: footer_tagline
        label: Footer tagline
        type: string

  - name: home
    label: Home page
    type: file
    path: content/home.json
    format: json
    fields:
      - { name: hero_badge, label: "Hero: little badge text", type: string }
      - { name: hero_line1, label: "Hero headline: line 1", type: string }
      - { name: hero_line2_italic, label: "Hero headline: line 2 (italic gradient word)", type: string }
      - { name: hero_line2, label: "Hero headline: line 2 (rest)", type: string }
      - { name: hero_line3, label: "Hero headline: line 3", type: string }
      - { name: hero_intro, label: "Hero: intro paragraph", type: text }
      - { name: apps_intro, label: "Our apps: intro", type: text }
      - { name: epistle_status, label: "EpistleChat card: status", type: string }
      - { name: epistle_card_text, label: "EpistleChat card: description", type: text }
      - { name: kraylus_status, label: "Kraylus card: status", type: string }
      - { name: kraylus_card_text, label: "Kraylus card: description", type: text }
      - name: statement
        label: Big statement
        type: text
        description: "Wrap words in *stars* for pink, or _underscores_ for cyan."
      - { name: about_intro, label: "About us: intro", type: text }
      - name: values
        label: "About us: values"
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: stats
        label: "About us: stats row"
        type: object
        list: true
        fields:
          - { name: number, label: "Number (e.g. 2, 100%, ∞)", type: string }
          - { name: label, label: Label, type: string }
      - { name: env_eyebrow, label: "Envelope scene: small label", type: string }
      - { name: env_title_1, label: "Envelope scene: heading line 1", type: string }
      - { name: env_title_2, label: "Envelope scene: heading line 2 (italic)", type: string }
      - { name: letter_text, label: "Envelope scene: the letter", type: text, description: "Keep it short (around 180 characters) so it fits on phones." }
      - { name: letter_sign, label: "Envelope scene: signature", type: string }
      - { name: env_cta, label: "Envelope scene: button text", type: string }
      - { name: contact_intro, label: "Contact: intro", type: text }

  - name: epistlechat
    label: EpistleChat page
    type: file
    path: content/epistlechat.json
    format: json
    fields:
      - { name: status, label: "Top: status pill", type: string }
      - { name: tagline, label: "Top: tagline (under the title)", type: string }
      - { name: intro, label: "Top: intro paragraph", type: text }
      - name: highlights
        label: "Top: highlight pills"
        type: string
        list: true
      - { name: waitlist_title, label: "Waitlist: title", type: string }
      - { name: waitlist_text, label: "Waitlist: text", type: text }
      - { name: hero_screenshot, label: "Top: phone screenshot", type: image }
      - { name: letters_title, label: "Letters: heading", type: string }
      - { name: letters_intro, label: "Letters: intro", type: text }
      - { name: letters_screenshot, label: "Letters: screenshot", type: image }
      - name: styles
        label: "Letters: delivery styles"
        type: object
        list: true
        fields:
          - { name: emoji, label: Emoji, type: string }
          - { name: name, label: Name, type: string }
          - { name: text, label: Description, type: text }
          - { name: color, label: "Colour (hex, e.g. #a99bf0)", type: string }
      - name: letter_extras
        label: "Letters: extras (Open when…, scents, Pip…)"
        type: object
        list: true
        fields:
          - { name: emoji, label: Emoji, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - { name: chat_title, label: "Chat: heading", type: string }
      - { name: chat_intro, label: "Chat: intro", type: text }
      - { name: chats_screenshot, label: "Chat: left screenshot", type: image }
      - { name: conversation_screenshot, label: "Chat: right screenshot", type: image }
      - name: features
        label: "Chat: features"
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values: [sparkle, pen, mic, smile, image, globe, mailbox, pip, check, people, music, heart, lock, star, clock]
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - name: groups
        label: "More: feature groups (Plan, Communities, Privacy…)"
        type: object
        list: true
        fields:
          - { name: emoji, label: Emoji, type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Short intro, type: string }
          - name: points
            label: Bullet points
            type: string
            list: true
      - { name: membership_title, label: "Memberships: heading", type: string }
      - { name: membership_text, label: "Memberships: text", type: text }

  - name: kraylus
    label: Kraylus page
    type: file
    path: content/kraylus.json
    format: json
    fields:
      - { name: status, label: Status pill, type: string }
      - { name: tagline, label: "Tagline (under the title)", type: string }
      - { name: intro, label: Intro paragraph, type: text }
      - { name: explore_title, label: "Ideas: heading", type: string }
      - name: explore
        label: "Ideas: cards"
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values: [send, wallet, coin, store, shield, chart, lock, star, globe, people]
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
      - { name: note, label: "Small print under the roadmap", type: text }
      - name: roadmap
        label: Roadmap
        type: object
        list: true
        fields:
          - { name: when, label: "When (e.g. Now, Next)", type: string }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: done, label: "Done?", type: boolean }

  - name: support
    label: Support FAQs
    type: file
    path: content/support.json
    format: json
    fields:
      - name: faqs
        label: Questions
        type: object
        list: true
        fields:
          - name: category
            label: Topic
            type: select
            options:
              values: [epistle, waitlist, account, studio]
          - { name: question, label: Question, type: string }
          - name: answer
            label: Answer
            type: text
            description: "Links: [link text](page.html)"

  - name: privacy
    label: Privacy Policy (hidden page)
    type: file
    path: content/privacy.json
    format: json
    fields:
      - { name: title, label: Title, type: string }
      - { name: updated, label: "Last updated (e.g. 22 November 2026)", type: string }
      - { name: intro, label: Short summary, type: text }
      - { name: body, label: Policy text, type: rich-text }

  - name: terms
    label: Terms of Service (hidden page)
    type: file
    path: content/terms.json
    format: json
    fields:
      - { name: title, label: Title, type: string }
      - { name: updated, label: "Last updated (e.g. 22 November 2026)", type: string }
      - { name: intro, label: Short summary, type: text }
      - { name: body, label: Terms text, type: rich-text }
